# Test-only upstream for the proxy image: stands in for carelog-be on 127.0.0.1:8080 (same netns).
# Echoes the request method and raw request target so tests can see exactly what reached the app.
daemon off;
worker_processes 1;
pid __PID__;
error_log __ERRLOG__;
events { worker_connections 64; }
http {
    access_log off;
    server {
        listen 127.0.0.1:8080;
        merge_slashes off;
        location / {
            default_type text/plain;
            return 200 "$request_method $request_uri\n";
        }
    }
}
