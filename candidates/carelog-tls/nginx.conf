# Carelog DEV TLS sidecar. Rendered by proxy-entrypoint.sh (envsubst reads only ${TASK_IPV4}).
#
# 8080 (plain HTTP, task IP): only the Carelog routes that existing callers use.
#   - Platform Gateway (carelog-be route Path=/api/** after the /api/v1/auth/** and
#     registration routes that go to Core). Source: ranikun-labs/platform-services
#     gateway-app/src/main/resources/application.yml, DEV Gateway env
#     PLATFORM_GATEWAY_CARELOG_BE_URI = http://ranikun-carelog-dev-api.dev.internal:8080
#   - Platform Core claims: GET /api/v1/internal/identity/claims/{accountId}
#     (CarelogProductClaimsHttpAdapter, base URL http://...:8080)
#   - Health: not on the task IP. The ECS healthCheck reads the loopback-only server on
#     127.0.0.1:9180 (below), which proxies to the app management liveness probe on 127.0.0.1:8081.
#     /api/v1/health is not used: it is not in the app's public list, so it answers 401 without auth.
#   Every other path, every other method and the enrollment path return 403.
#
# 8443 (TLS, task IP): Core enrollment only (CarelogEnrollmentHttpAdapter, PUT).
#
# Spring context-path is /api/v1 (carelog-be application.yml). Paths below include it.
#
# Anti-bypass: nginx matches the normalized, decoded $uri, but forwards the raw request.
# Spring/Tomcat normalizes some encodings and path parameters differently (for example
# "..;" and encoded dots or slashes). Requests with those forms are refused before
# location matching. Segment characters exclude "/", ";", "\" and "%", so a segment
# cannot carry a path parameter or a decoded separator.

# Loopback-only health server for the ECS container healthCheck (task-fragments.json, carelog.tfvars.example,
# Dockerfile HEALTHCHECK all carry the same command). It listens on 127.0.0.1 only, so it is not reachable
# from the task IP (Gateway/Core) and it is not part of the 8080/8443 allowlist. Its only route proxies to the
# app's management liveness probe, which needs no database or Redis.
server {
    listen 127.0.0.1:9180;
    server_tokens off;
    access_log off;

    location = /healthz {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081/actuator/health/liveness;
    }

    location / {
        return 404;
    }
}

server {
    listen ${TASK_IPV4}:8080;
    server_tokens off;
    # Keep "//" distinct: with the default merge_slashes, "//api/v1/..." matches an allowed location and is
    # forwarded unnormalized, which Tomcat may resolve differently. Refuse it instead.
    merge_slashes off;
    client_max_body_size 1m;

    if ($request_uri ~* "(%2e|%2f|%3b|%5c|%00|;|\x5c|\.\.)") {
        return 403;
    }

    # Customers (Gateway)
    location ~ "^/api/v1/users/customers$" {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/users/customers/[A-Za-z0-9._@+~-]+$" {
        limit_except GET PATCH { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Customer events (Gateway)
    location ~ "^/api/v1/customer-events$" {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/customer-events/[A-Za-z0-9._@+~-]+$" {
        limit_except GET PATCH { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/customer-events/[A-Za-z0-9._@+~-]+/(occur|cancel)$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Relations (Gateway)
    location ~ "^/api/v1/relations$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/relations/manager$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/relations/manager/[A-Za-z0-9._@+~-]+/customer/[A-Za-z0-9._@+~-]+$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/relations/customer/[A-Za-z0-9._@+~-]+$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/relations/[A-Za-z0-9._@+~-]+/status$" {
        limit_except PATCH { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/relations/[A-Za-z0-9._@+~-]+$" {
        limit_except GET DELETE { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Journals and templates (Gateway)
    location ~ "^/api/v1/relations/[A-Za-z0-9._@+~-]+/journals$" {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/relations/[A-Za-z0-9._@+~-]+/journals/[A-Za-z0-9._@+~-]+$" {
        limit_except GET PUT { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/relations/[A-Za-z0-9._@+~-]+/journals/[A-Za-z0-9._@+~-]+/history$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/journal-templates$" {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Users (Gateway). The public manager registration path is in the list.
    location ~ "^/api/v1/users/managers$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/users/user-id/[A-Za-z0-9._@+~-]+$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/users/email/[A-Za-z0-9._@+~-]+$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location ~ "^/api/v1/users/[A-Za-z0-9._@+~-]+$" {
        limit_except PATCH DELETE { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Core identity claims (plain HTTP on 8080, service-to-service credentials in headers)
    location ~ "^/api/v1/internal/identity/claims/[A-Za-z0-9._@+~-]+$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Liveness-style route on the application port (not used by ECS health check)
    location ~ "^/api/v1/health$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 403;
    }
}

server {
    listen ${TASK_IPV4}:8443 ssl;
    server_tokens off;
    merge_slashes off;
    ssl_certificate /run/carelog-tls/server.crt;
    ssl_certificate_key /run/carelog-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;

    if ($request_uri ~* "(%2e|%2f|%3b|%5c|%00|;|\x5c|\.\.)") {
        return 403;
    }

    # Core enrollment (PUT only). Authorization is enforced by the application.
    location ~ "^/api/v1/internal/v1/identity/carelog/enrollments/[A-Za-z0-9._@+~-]+$" {
        limit_except PUT { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 403;
    }
}
