server {
    listen ${TASK_IPV4}:8080;
    location ~ ^/api/v1/(users/customers|customer-events)(/|$) { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location ~ ^/api/v1/internal/identity/claims(/|$) { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location / { return 403; }
}
server {
    listen ${TASK_IPV4}:8443 ssl;
    ssl_certificate /run/carelog-tls/server.crt;
    ssl_certificate_key /run/carelog-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ~ ^/api/v1/internal/v1/identity/carelog/enrollments/[^/]+$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 403; }
}
