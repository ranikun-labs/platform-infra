name: DEV plan gate tests

on:
  pull_request:
    paths:
      - '.github/scripts/dev_plan_gate.py'
      - '.github/scripts/tests/**'
      - '.github/workflows/dev-signup-off-plan.yml'
      - '.github/workflows/dev-plan-gate-tests.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install PyYAML for workflow parse test
        run: python3 -m pip install --user 'pyyaml==6.0.2'

      - name: Run gate and workflow unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
