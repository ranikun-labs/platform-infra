name: DEV read-only diagnostic

# One-off, read-only evidence collection for DEV (ECS task definition env/secret names, ElastiCache TLS, RDS force_ssl).
# Only AWS read APIs are called (scripts/diag/dev-readonly-diagnostic.sh). No Terraform, no secret values, no writes.
#
# Usability probe: this job intentionally does NOT require github.ref == refs/heads/main (dev-shared-plan.yml does).
# Whether the OIDC role ranikun-dev-shared-plan accepts a non-main ref depends on its trust policy
# (sub claim / job_workflow_ref). If the role trust is restricted to main, configure-aws-credentials fails with
# "Not authorized to perform sts:AssumeRoleWithWebIdentity" and the run is recorded as a trust mismatch.
# Trigger is limited to this diagnostic branch (push) and manual dispatch; nothing else runs it.

on:
  push:
    branches: [claude/great-heisenberg-u3i75y-dev-diag]
    paths:
      - .github/workflows/dev-readonly-diagnostic.yml
      - scripts/diag/dev-readonly-diagnostic.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: dev-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'ranikun-labs/platform-infra'
    runs-on: ubuntu-latest
    environment: dev-plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test output masking (no AWS)
        run: bash scripts/diag/dev-readonly-diagnostic.sh selftest
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::124495093425:role/ranikun-dev-shared-plan
          aws-region: ap-northeast-2
          audience: sts.amazonaws.com
          allowed-account-ids: '124495093425'
      - name: Read-only DEV diagnostic
        run: bash scripts/diag/dev-readonly-diagnostic.sh run
